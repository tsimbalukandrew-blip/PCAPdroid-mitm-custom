name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  release:
    name: Build unsigned release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy requires a matching Python interpreter on the build host.
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APKs
        run: |
          echo "Signing APKs..."
          find app/build/outputs/apk -name '*-unsigned.apk' | while read apk; do
            signed="${apk%-unsigned.apk}-signed.apk"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore keystore -storepass android -keypass android "$apk" key0
            zipalign -v 4 "$apk" "$signed"
            echo "Signed: $signed"
          done

      - name: Check 16 KB alignment of native libraries
        run: |
          chmod +x .github/check_16kb_alignment.sh
          .github/check_16kb_alignment.sh $(find app/build/outputs/apk -name '*-signed.apk')

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-signed
          path: app/build/outputs/apk/*/release/*-signed.apk
          retention-days: 30
